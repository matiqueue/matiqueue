<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Neon Border -->
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Bar Equalizer Gradient -->
    <linearGradient id="eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="hud-glow-left" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hud-glow-right" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- Matrix Dot Pattern -->
    <pattern id="hud-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes radar-pulse {
      0% { r: 5px; opacity: 1; }
      50% { r: 5px; opacity: 0.4; }
      100% { r: 5px; opacity: 1; }
    }
    @keyframes wave-ring {
      0% { r: 5px; opacity: 0.9; stroke-width: 1.5px; }
      100% { r: 16px; opacity: 0; stroke-width: 0.3px; }
    }
    @keyframes eq-jump-1 { 0%, 100% { height: 16px; y: 54px; } 50% { height: 58px; y: 12px; } }
    @keyframes eq-jump-2 { 0%, 100% { height: 48px; y: 22px; } 50% { height: 18px; y: 52px; } }
    @keyframes eq-jump-3 { 0%, 100% { height: 30px; y: 40px; } 50% { height: 64px; y: 6px; } }
    @keyframes eq-jump-4 { 0%, 100% { height: 56px; y: 14px; } 50% { height: 26px; y: 44px; } }
    @keyframes eq-jump-5 { 0%, 100% { height: 22px; y: 48px; } 50% { height: 50px; y: 20px; } }
    @keyframes eq-jump-6 { 0%, 100% { height: 40px; y: 30px; } 50% { height: 14px; y: 56px; } }
    @keyframes eq-jump-7 { 0%, 100% { height: 62px; y: 8px; } 50% { height: 34px; y: 36px; } }
    @keyframes eq-jump-8 { 0%, 100% { height: 28px; y: 42px; } 50% { height: 54px; y: 16px; } }
    @keyframes eq-jump-9 { 0%, 100% { height: 50px; y: 20px; } 50% { height: 20px; y: 50px; } }
    @keyframes eq-jump-10 { 0%, 100% { height: 18px; y: 52px; } 50% { height: 60px; y: 10px; } }
    @keyframes eq-jump-11 { 0%, 100% { height: 44px; y: 26px; } 50% { height: 22px; y: 48px; } }
    @keyframes eq-jump-12 { 0%, 100% { height: 32px; y: 38px; } 50% { height: 52px; y: 18px; } }

    .eq-1 { animation: eq-jump-1 1.2s infinite ease-in-out; }
    .eq-2 { animation: eq-jump-2 1.4s infinite ease-in-out; }
    .eq-3 { animation: eq-jump-3 1.1s infinite ease-in-out; }
    .eq-4 { animation: eq-jump-4 1.5s infinite ease-in-out; }
    .eq-5 { animation: eq-jump-5 1.3s infinite ease-in-out; }
    .eq-6 { animation: eq-jump-6 1.0s infinite ease-in-out; }
    .eq-7 { animation: eq-jump-7 1.6s infinite ease-in-out; }
    .eq-8 { animation: eq-jump-8 1.25s infinite ease-in-out; }
    .eq-9 { animation: eq-jump-9 1.45s infinite ease-in-out; }
    .eq-10 { animation: eq-jump-10 1.15s infinite ease-in-out; }
    .eq-11 { animation: eq-jump-11 1.35s infinite ease-in-out; }
    .eq-12 { animation: eq-jump-12 1.55s infinite ease-in-out; }

    .radar-dot { animation: radar-pulse 2s infinite ease-in-out; }
    .radar-ring { animation: wave-ring 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="846" height="166" rx="16" fill="url(#hud-bg)"/>
  <rect x="2" y="2" width="846" height="166" rx="16" fill="url(#hud-dots)"/>
  <rect x="2" y="2" width="846" height="166" rx="16" fill="url(#hud-glow-left)"/>
  <rect x="2" y="2" width="846" height="166" rx="16" fill="url(#hud-glow-right)"/>
  <rect x="2" y="2" width="846" height="166" rx="16" stroke="url(#hud-border)" stroke-width="1.4" fill="none"/>

  <!-- Left Side: Live Signal Status & Headline -->
  <g transform="translate(36, 32)">
    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <circle cx="10" cy="10" r="5" fill="#22c55e" class="radar-dot"/>
      <circle cx="10" cy="10" r="5" fill="none" stroke="#22c55e" class="radar-ring"/>
      <text x="24" y="14" fill="#34d399" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.1em">
        STATUS: OPEN FOR NEW OPPORTUNITIES
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="48" fill="#f8fafc" class="font-sans" font-size="24" font-weight="800" letter-spacing="-0.02em">
      Let's Engineer Something Exceptional.
    </text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" class="font-sans" font-size="14" font-weight="400">
      High-performance web apps • Next.js &amp; Python architectures • Real-time scale
    </text>

    <!-- Bottom Specs Line -->
    <text x="0" y="100" fill="#64748b" class="font-mono" font-size="11">
      ⚡ Direct ping: <tspan fill="#38bdf8">szymon.goral@icloud.com</tspan> • Location: <tspan fill="#f8fafc">Kraków / Olkusz, PL</tspan>
    </text>
  </g>

  <!-- Right Side: Animated Frequency Equalizer Waves -->
  <g transform="translate(630, 48)">
    <!-- Label -->
    <text x="85" y="-12" fill="#64748b" class="font-mono" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">
      LIVE DISPATCH // 100% SYNC
    </text>

    <!-- Equalizer Visualizer Bars (12 animated bars) -->
    <g>
      <rect x="0" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-1"/>
      <rect x="14" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-2"/>
      <rect x="28" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-3"/>
      <rect x="42" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-4"/>
      <rect x="56" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-5"/>
      <rect x="70" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-6"/>
      <rect x="84" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-7"/>
      <rect x="98" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-8"/>
      <rect x="112" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-9"/>
      <rect x="126" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-10"/>
      <rect x="140" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-11"/>
      <rect x="154" width="7" rx="3.5" fill="url(#eq-grad)" class="eq-12"/>
    </g>
  </g>
</svg>
