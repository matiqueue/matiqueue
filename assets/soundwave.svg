<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64" fill="none">
  <defs>
    <!-- Left Equalizer Gradient (Cyan to Blue) -->
    <linearGradient id="eq-left" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Right Equalizer Gradient (Blue to Emerald) -->
    <linearGradient id="eq-right" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes radar-pulse {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 4px; opacity: 0.4; }
    }
    @keyframes wave-ring {
      0% { r: 4px; opacity: 0.9; stroke-width: 1.5px; }
      100% { r: 14px; opacity: 0; stroke-width: 0.2px; }
    }

    @keyframes bar-anim-1 { 0%, 100% { height: 8px; y: 44px; } 50% { height: 38px; y: 14px; } }
    @keyframes bar-anim-2 { 0%, 100% { height: 28px; y: 24px; } 50% { height: 10px; y: 42px; } }
    @keyframes bar-anim-3 { 0%, 100% { height: 18px; y: 34px; } 50% { height: 44px; y: 8px; } }
    @keyframes bar-anim-4 { 0%, 100% { height: 36px; y: 16px; } 50% { height: 14px; y: 38px; } }
    @keyframes bar-anim-5 { 0%, 100% { height: 12px; y: 40px; } 50% { height: 32px; y: 20px; } }
    @keyframes bar-anim-6 { 0%, 100% { height: 42px; y: 10px; } 50% { height: 16px; y: 36px; } }
    @keyframes bar-anim-7 { 0%, 100% { height: 22px; y: 30px; } 50% { height: 40px; y: 12px; } }
    @keyframes bar-anim-8 { 0%, 100% { height: 32px; y: 20px; } 50% { height: 12px; y: 40px; } }

    .b1 { animation: bar-anim-1 1.2s infinite ease-in-out; }
    .b2 { animation: bar-anim-2 1.4s infinite ease-in-out; }
    .b3 { animation: bar-anim-3 1.1s infinite ease-in-out; }
    .b4 { animation: bar-anim-4 1.5s infinite ease-in-out; }
    .b5 { animation: bar-anim-5 1.3s infinite ease-in-out; }
    .b6 { animation: bar-anim-6 1.0s infinite ease-in-out; }
    .b7 { animation: bar-anim-7 1.6s infinite ease-in-out; }
    .b8 { animation: bar-anim-8 1.25s infinite ease-in-out; }

    .radar-dot { animation: radar-pulse 2s infinite ease-in-out; }
    .radar-ring { animation: wave-ring 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  </style>

  <!-- Left Side Equalizer Spectrum (8 bars) -->
  <g transform="translate(40, 6)">
    <rect x="0" width="5" rx="2.5" fill="url(#eq-left)" class="b1"/>
    <rect x="11" width="5" rx="2.5" fill="url(#eq-left)" class="b2"/>
    <rect x="22" width="5" rx="2.5" fill="url(#eq-left)" class="b3"/>
    <rect x="33" width="5" rx="2.5" fill="url(#eq-left)" class="b4"/>
    <rect x="44" width="5" rx="2.5" fill="url(#eq-left)" class="b5"/>
    <rect x="55" width="5" rx="2.5" fill="url(#eq-left)" class="b6"/>
    <rect x="66" width="5" rx="2.5" fill="url(#eq-left)" class="b7"/>
    <rect x="77" width="5" rx="2.5" fill="url(#eq-left)" class="b8"/>
    <rect x="88" width="5" rx="2.5" fill="url(#eq-left)" class="b3"/>
    <rect x="99" width="5" rx="2.5" fill="url(#eq-left)" class="b1"/>
    <rect x="110" width="5" rx="2.5" fill="url(#eq-left)" class="b5"/>
    <rect x="121" width="5" rx="2.5" fill="url(#eq-left)" class="b2"/>
  </g>

  <!-- Center Ambient Glow -->
  <circle cx="450" cy="32" r="160" fill="url(#center-glow)"/>

  <!-- Center Live Signal Badge (No border, pure typographic & beacon HUD) -->
  <g transform="translate(450, 24)" text-anchor="middle">
    <!-- Pulsing Radar Beacon -->
    <g transform="translate(0, -6)">
      <circle cx="-168" cy="6" r="4.5" fill="#22c55e" class="radar-dot"/>
      <circle cx="-168" cy="6" r="4.5" fill="none" stroke="#22c55e" class="radar-ring"/>
      <text x="-152" y="10" fill="#34d399" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.12em" text-anchor="start">
        LIVE SIGNAL: OPEN FOR FULL-STACK &amp; PYTHON CONTRACTS
      </text>
    </g>

    <!-- Subtext Line -->
    <text x="0" y="24" fill="#94a3b8" class="font-sans" font-size="13" font-weight="500" letter-spacing="0.02em">
      Direct Dispatch Channel • High Velocity • Kraków / Olkusz, PL
    </text>
  </g>

  <!-- Right Side Equalizer Spectrum (8 bars) -->
  <g transform="translate(730, 6)">
    <rect x="0" width="5" rx="2.5" fill="url(#eq-right)" class="b5"/>
    <rect x="11" width="5" rx="2.5" fill="url(#eq-right)" class="b1"/>
    <rect x="22" width="5" rx="2.5" fill="url(#eq-right)" class="b7"/>
    <rect x="33" width="5" rx="2.5" fill="url(#eq-right)" class="b3"/>
    <rect x="44" width="5" rx="2.5" fill="url(#eq-right)" class="b8"/>
    <rect x="55" width="5" rx="2.5" fill="url(#eq-right)" class="b4"/>
    <rect x="66" width="5" rx="2.5" fill="url(#eq-right)" class="b2"/>
    <rect x="77" width="5" rx="2.5" fill="url(#eq-right)" class="b6"/>
    <rect x="88" width="5" rx="2.5" fill="url(#eq-right)" class="b1"/>
    <rect x="99" width="5" rx="2.5" fill="url(#eq-right)" class="b5"/>
    <rect x="110" width="5" rx="2.5" fill="url(#eq-right)" class="b2"/>
    <rect x="121" width="5" rx="2.5" fill="url(#eq-right)" class="b7"/>
  </g>
</svg>
