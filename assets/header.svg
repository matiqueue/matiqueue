<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner Window Bar Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Name Typography Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Subtitle Cyan/Emerald Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Chip Background Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="aurora-cyan" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-emerald" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-violet" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Circuit Dot Matrix Pattern -->
    <pattern id="matrix-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes radar-ping {
      0% { r: 4.5px; opacity: 0.9; stroke-width: 1.5px; }
      100% { r: 13px; opacity: 0; stroke-width: 0.4px; }
    }
    @keyframes aurora-breathe-1 {
      0%, 100% { opacity: 0.25; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.45; transform: scale(1.08) translate(20px, -10px); }
    }
    @keyframes aurora-breathe-2 {
      0%, 100% { opacity: 0.22; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.42; transform: scale(1.1) translate(-25px, 15px); }
    }
    @keyframes name-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.6)) drop-shadow(0 0 35px rgba(52, 211, 153, 0.35)); }
    }
    @keyframes border-shimmer {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    .pulsing-live {
      animation: pulse-dot 2s infinite ease-in-out;
      transform-origin: 16px 13px;
    }
    .radar-circle {
      animation: radar-ping 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 16px 13px;
    }
    .aurora-layer-1 {
      animation: aurora-breathe-1 7s infinite ease-in-out;
      transform-origin: 200px 100px;
    }
    .aurora-layer-2 {
      animation: aurora-breathe-2 8s infinite ease-in-out;
      transform-origin: 800px 100px;
    }
    .title-animated {
      animation: name-glow 5s infinite ease-in-out;
    }
    .border-animated {
      animation: border-shimmer 4s infinite ease-in-out;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    }
  </style>

  <!-- Main Canvas Card Container -->
  <rect x="2" y="2" width="996" height="316" rx="20" fill="url(#bg-canvas)"/>
  
  <!-- Subtle Grid Dot Matrix -->
  <rect x="2" y="2" width="996" height="316" rx="20" fill="url(#matrix-dots)"/>

  <!-- Atmospheric Dynamic Glowing Orbs -->
  <rect x="2" y="2" width="996" height="316" rx="20" fill="url(#aurora-cyan)" class="aurora-layer-1"/>
  <rect x="2" y="2" width="996" height="316" rx="20" fill="url(#aurora-violet)" class="aurora-layer-2"/>
  <rect x="2" y="2" width="996" height="316" rx="20" fill="url(#aurora-emerald)"/>

  <!-- Outer Neon Shimmering Border -->
  <rect x="2" y="2" width="996" height="316" rx="20" stroke="url(#border-glow)" stroke-width="1.5" fill="none" class="border-animated"/>

  <!-- Top macOS Window Header Bar -->
  <g transform="translate(0, 0)">
    <path d="M 2 22 Q 2 2 22 2 L 978 2 Q 998 2 998 22 L 998 52 L 2 52 Z" fill="url(#bar-grad)"/>
    <line x1="2" y1="52" x2="998" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Mac Traffic Light Dots -->
    <circle cx="36" cy="27" r="6" fill="#ef4444"/>
    <circle cx="56" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="76" cy="27" r="6" fill="#10b981"/>

    <!-- Window Monospace Breadcrumb -->
    <text x="500" y="31" fill="#64748b" text-anchor="middle" class="font-mono" font-size="12" font-weight="500" letter-spacing="0.05em">
      matiqueue.dev — zsh — 80×24
    </text>

    <!-- Top Right Status Pill with Dual Radar Pulse -->
    <g transform="translate(775, 14)">
      <rect width="190" height="26" rx="13" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="13" r="4.5" fill="#22c55e" class="pulsing-live"/>
      <circle cx="16" cy="13" r="4.5" fill="none" stroke="#22c55e" class="radar-circle"/>
      <text x="28" y="17" fill="#cbd5e1" class="font-mono" font-size="11" font-weight="600">OPEN TO WORK</text>
      <text x="140" y="17" fill="#64748b" class="font-mono" font-size="11">🇵🇱 PL</text>
    </g>
  </g>

  <!-- Hero Content Area -->
  <g transform="translate(50, 75)">
    <!-- Small Overline Tag with Python / TS Highlights -->
    <text x="0" y="22" fill="url(#sub-grad)" class="font-mono" font-size="13" font-weight="700" letter-spacing="0.12em">
      // FULL-STACK ENGINEER • NEXT.JS • TYPESCRIPT • PYTHON / DJANGO
    </text>

    <!-- Main Name Title with Glowing Shadow -->
    <text x="0" y="76" fill="url(#name-grad)" class="font-sans title-animated" font-size="52" font-weight="900" letter-spacing="-0.03em">
      Szymon Góral
    </text>

    <!-- Primary Descriptor -->
    <text x="0" y="114" fill="#f8fafc" class="font-sans" font-size="20" font-weight="500" letter-spacing="-0.01em">
      Architecting high-performance web systems with Next.js, TypeScript &amp; Python / Django.
    </text>

    <!-- Secondary Mission Statement -->
    <text x="0" y="140" fill="#94a3b8" class="font-sans" font-size="15" font-weight="400">
      Obsessed with clean architecture, real-time multiplayer systems &amp; fluid, pixel-perfect UI/UX.
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="162" x2="900" y2="162" stroke="#1e293b" stroke-width="1"/>

    <!-- Bottom Feature / Tech Pills -->
    <g transform="translate(0, 178)">
      <!-- Next.js -->
      <g transform="translate(0, 0)">
        <rect width="118" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="59" y="22" fill="#f8fafc" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">▲ NEXT.JS 15</text>
      </g>

      <!-- TypeScript -->
      <g transform="translate(130, 0)">
        <rect width="130" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="65" y="22" fill="#38bdf8" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">TS TYPESCRIPT</text>
      </g>

      <!-- Python & Django -->
      <g transform="translate(272, 0)">
        <rect width="168" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="84" y="22" fill="#34d399" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">🐍 PYTHON &amp; DJANGO</text>
      </g>

      <!-- React -->
      <g transform="translate(452, 0)">
        <rect width="105" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="52" y="22" fill="#67e8f9" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">⚛ REACT</text>
      </g>

      <!-- MongoDB & Databases -->
      <g transform="translate(569, 0)">
        <rect width="155" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="77" y="22" fill="#10b981" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">🍃 MONGODB &amp; SQL</text>
      </g>

      <!-- Sockets & Real-time -->
      <g transform="translate(736, 0)">
        <rect width="164" height="34" rx="8" fill="url(#chip-grad)" stroke="#334155" stroke-width="1"/>
        <text x="82" y="22" fill="#f43f5e" text-anchor="middle" class="font-mono" font-size="11" font-weight="600">⚡ SOCKETS &amp; REALTIME</text>
      </g>
    </g>
  </g>
</svg>
