<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="100%" height="90" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="footer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="footer-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .footer-border-anim {
      animation: glow-pulse 4s infinite ease-in-out;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="996" height="86" rx="16" fill="url(#footer-bg)"/>
  <rect x="2" y="2" width="996" height="86" rx="16" fill="url(#footer-dots)"/>
  <rect x="2" y="2" width="996" height="86" rx="16" fill="url(#footer-glow)"/>
  <rect x="2" y="2" width="996" height="86" rx="16" stroke="url(#footer-border)" stroke-width="1.2" fill="none" class="footer-border-anim"/>

  <!-- Left: Monospace Status -->
  <text x="35" y="49" fill="#94a3b8" class="font-mono" font-size="12" font-weight="500">
    ⚡ <tspan fill="#f8fafc" font-weight="700">Szymon Góral</tspan> &bull; Kraków / Olkusz, PL 🇵🇱
  </text>

  <!-- Right: Status / Tagline -->
  <text x="965" y="49" fill="#64748b" text-anchor="end" class="font-mono" font-size="12">
    Designed for performance &bull; <tspan fill="#38bdf8">Next.js</tspan> &bull; <tspan fill="#34d399">Python</tspan>
  </text>
</svg>
