name: Generate GitHub Stats

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install stats core package
        run: |
          mkdir -p "${{ runner.temp }}/grs-core"
          npm --prefix "${{ runner.temp }}/grs-core" install --no-save --no-package-lock --ignore-scripts @stats-organization/github-readme-stats-core@2

      - name: Generate merged GitHub Stats & Top Languages SVGs
        run: node .github/scripts/generate-stats.mjs
        env:
          CORE_BUILD_DIR: ${{ runner.temp }}/grs-core/node_modules/@stats-organization/github-readme-stats-core/build
          FETCH_MULTI_PAGE_STARS: "true"
          PRIMARY_USERNAME: ${{ github.repository_owner }}
          PRIMARY_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          WORK_STATS_TOKEN: ${{ secrets.WORK_STATS_TOKEN }}
          WORK_USERNAME: ${{ vars.WORK_USERNAME }}
          EXCLUDE_REPO: ${{ vars.EXCLUDE_REPO }}
          OUTPUT_DIR: dist

      - name: Generate merged Streak Stats SVG
        run: node .github/scripts/generate-streak.mjs
        env:
          PRIMARY_USERNAME: ${{ github.repository_owner }}
          PRIMARY_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          WORK_STATS_TOKEN: ${{ secrets.WORK_STATS_TOKEN }}
          WORK_USERNAME: ${{ vars.WORK_USERNAME }}
          STREAK_TIMEZONE: Europe/Warsaw
          OUTPUT_DIR: dist

      - name: Push Stats SVGs to Stats Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
