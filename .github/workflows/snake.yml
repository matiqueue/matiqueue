name: Generate Snake

on:
  schedule:
    # Run everyday at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: matiqueue
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Remove progress bar from snake SVGs
        run: |
          sed -i -E 's/<rect class="u [^"]*"[^>]*\/>//g' dist/*.svg
          sed -i -E 's/viewBox="-16 -32 880 192"/viewBox="-16 0 880 114"/g' dist/*.svg
          sed -i -E 's/height="192"/height="114"/g' dist/*.svg

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
