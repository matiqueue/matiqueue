name: Generate Snake

on:
  schedule:
    # Run everyday at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch Platane/snk SVG renderer
        run: |
          rm -rf "${{ runner.temp }}/snk"
          git clone --depth 1 --filter=blob:none --sparse --branch v3 https://github.com/Platane/snk.git "${{ runner.temp }}/snk"
          git -C "${{ runner.temp }}/snk" sparse-checkout set svg-only/dist

      - name: Generate merged Snake SVGs
        run: node .github/scripts/generate-snake.mjs
        env:
          SNK_ENTRY: ${{ runner.temp }}/snk/svg-only/dist/index.js
          PRIMARY_USERNAME: ${{ github.repository_owner }}
          PRIMARY_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          WORK_STATS_TOKEN: ${{ secrets.WORK_STATS_TOKEN }}
          WORK_USERNAME: ${{ vars.WORK_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GITHUB_USER_NAME: ${{ github.repository_owner }}
          INPUT_OUTPUTS: |
            dist/github-contribution-grid-snake.svg?color_snake=%2361dafb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2361dafb

      - name: Remove progress bar from snake SVGs
        run: |
          sed -i -E 's/<rect class="u [^"]*"[^>]*\/>//g' dist/*.svg
          sed -i -E 's/viewBox="-16 -32 880 192"/viewBox="-16 0 880 114"/g' dist/*.svg
          sed -i -E 's/height="192"/height="114"/g' dist/*.svg

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
